name: CI

on:
  push:
    branches: [development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify server (build, tests and JaCoCo threshold)
        run: ./scripts/verify.sh --server
      - name: Upload server reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-reports
          include-hidden-files: true
          retention-days: 7
          path: |
            backend/target/site/jacoco
            backend/target/surefire-reports
            .verify-logs/server.log

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/airbnb_clone/.nvmrc
          cache: npm
          cache-dependency-path: frontend/airbnb_clone/package-lock.json
      - name: Verify client (lint, build and tests)
        run: ./scripts/verify.sh --client
      - name: Check client v8 coverage threshold
        working-directory: frontend/airbnb_clone
        run: npm run test:coverage
      - name: Upload client coverage and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-reports
          include-hidden-files: true
          retention-days: 7
          path: |
            frontend/airbnb_clone/coverage
            .verify-logs/client-*.log
