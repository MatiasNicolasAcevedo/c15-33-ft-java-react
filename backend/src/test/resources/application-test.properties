# Configuración fija de tests: no importa application.properties ni env.properties.
# La conexión JDBC la provee @ServiceConnection; Docker es el único requisito externo.
server.port=0
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Base64 de 32 bytes inventados, públicos y exclusivos de los tests.
jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
jwt.expiration=86400000
# Orígenes fijos de tests; no se leen variables ni configuración reales.
cors.allowed-origins=http://localhost:5173,http://localhost:8081

# Contrato de errores y único endpoint operativo expuesto.
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
